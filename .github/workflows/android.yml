name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test and validate GitHub App manifest
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/validate-github-app-manifest.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Lint, test, and assemble
        id: gradle_verification
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-verification.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rock-music-gradle-verification
          path: gradle-verification.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Gradle verification failed
        if: steps.gradle_verification.outputs.exit_code != '0'
        run: |
          echo "Gradle verification failed with exit code ${{ steps.gradle_verification.outputs.exit_code }}"
          exit 1

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rock-music-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
