name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Compose compatibility diagnostic
        run: |
          sed -i '/import androidx.compose.foundation.layout.weight/d' app/src/main/java/com/rockmusic/app/presentation/RockMusicRoot.kt
          sed -i '/import androidx.compose.foundation.layout.weight/d' app/src/main/java/com/rockmusic/app/presentation/settings/AppearanceScreen.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Lint, test, and assemble
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-verification.log

      - name: Persist verified Compose compatibility fix
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          sed -i '/import androidx.compose.foundation.layout.weight/d' app/src/main/java/com/rockmusic/app/presentation/RockMusicRoot.kt
          sed -i '/import androidx.compose.foundation.layout.weight/d' app/src/main/java/com/rockmusic/app/presentation/settings/AppearanceScreen.kt
          if ! git diff --quiet -- app/src/main/java/com/rockmusic/app/presentation/RockMusicRoot.kt app/src/main/java/com/rockmusic/app/presentation/settings/AppearanceScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/rockmusic/app/presentation/RockMusicRoot.kt app/src/main/java/com/rockmusic/app/presentation/settings/AppearanceScreen.kt
            git commit -m "fix: remove invalid Compose weight imports"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rock-music-gradle-verification
          path: gradle-verification.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rock-music-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
